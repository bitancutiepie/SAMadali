<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="160">
  <defs>
    <!-- Background Frame -->
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141720" />
      <stop offset="100%" stop-color="#0d0f14" />
    </linearGradient>

    <!-- Card Elevation Filter -->
    <filter id="tileElevation" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#ffffff" flood-opacity="0.08" />
    </filter>

    <style>
      @keyframes activePulse {
        0%, 100% { transform: translateY(0px); border-color: #ffffff; }
        50% { transform: translateY(-3px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -24; }
      }
      .stage-1 { animation: activePulse 4s ease-in-out infinite 0s; }
      .stage-2 { animation: activePulse 4s ease-in-out infinite 1s; }
      .stage-3 { animation: activePulse 4s ease-in-out infinite 2s; }
      .stage-4 { animation: activePulse 4s ease-in-out infinite 3s; }
      .wire-stream {
        stroke-dasharray: 6 6;
        animation: dashFlow 1.8s linear infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="0" y="0" width="900" height="160" rx="14" fill="url(#flowBg)" stroke="#232733" stroke-width="1.2" />

  <!-- Animated Monochrome Connecting Bus Lines -->
  <line class="wire-stream" x1="195" y1="80" x2="250" y2="80" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" />
  <line class="wire-stream" x1="420" y1="80" x2="475" y2="80" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" />
  <line class="wire-stream" x1="645" y1="80" x2="700" y2="80" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Stage 1: Configure -->
  <g class="stage-1" transform="translate(25, 25)">
    <rect x="0" y="0" width="170" height="110" rx="10" fill="#181b24" stroke="#333745" stroke-width="1" filter="url(#tileElevation)" />
    <!-- Sliders Vector Icon -->
    <circle cx="28" cy="28" r="10" fill="#101217" stroke="#ffffff" stroke-width="1" stroke-opacity="0.7" />
    <line x1="24" y1="28" x2="32" y2="28" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="26" cy="28" r="1.5" fill="#ffffff" />
    <text x="46" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700">01. CONFIGURE</text>
    <text x="20" y="65" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600">Section Presets</text>
    <text x="20" y="82" fill="#7a8296" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">3106 / 3107 / 3108</text>
    <text x="20" y="97" fill="#525869" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">config.psd1 validation</text>
  </g>

  <!-- Stage 2: Pack ISO -->
  <g class="stage-2" transform="translate(250, 25)">
    <rect x="0" y="0" width="170" height="110" rx="10" fill="#181b24" stroke="#333745" stroke-width="1" filter="url(#tileElevation)" />
    <!-- Disc Vector Icon -->
    <circle cx="28" cy="28" r="10" fill="#101217" stroke="#ffffff" stroke-width="1" stroke-opacity="0.7" />
    <circle cx="28" cy="28" r="3" fill="none" stroke="#ffffff" stroke-width="1" />
    <text x="46" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700">02. PACK ISO</text>
    <text x="20" y="65" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600">lab_scripts.iso</text>
    <text x="20" y="82" fill="#7a8296" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">IMAPI2FS optical build</text>
    <text x="20" y="97" fill="#525869" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">Stages scripts + verifier</text>
  </g>

  <!-- Stage 3: Build VM -->
  <g class="stage-3" transform="translate(475, 25)">
    <rect x="0" y="0" width="170" height="110" rx="10" fill="#181b24" stroke="#333745" stroke-width="1" filter="url(#tileElevation)" />
    <!-- Virtual Machine Vector Icon -->
    <circle cx="28" cy="28" r="10" fill="#101217" stroke="#ffffff" stroke-width="1" stroke-opacity="0.7" />
    <rect x="23" y="24" width="10" height="8" rx="1" fill="none" stroke="#ffffff" stroke-width="1" />
    <line x1="28" y1="32" x2="28" y2="34" stroke="#ffffff" stroke-width="1" />
    <line x1="25" y1="34" x2="31" y2="34" stroke="#ffffff" stroke-width="1" />
    <text x="46" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700">03. BUILD VM</text>
    <text x="20" y="65" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600">VirtualBox Host</text>
    <text x="20" y="82" fill="#7a8296" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">4GB RAM • Bridged NIC</text>
    <text x="20" y="97" fill="#525869" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">Dual ISO auto-mount</text>
  </g>

  <!-- Stage 4: Verify 50 Pts -->
  <g class="stage-4" transform="translate(700, 25)">
    <rect x="0" y="0" width="175" height="110" rx="10" fill="#181b24" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5" filter="url(#tileElevation)" />
    <!-- Checkmark Badge Vector Icon -->
    <circle cx="28" cy="28" r="10" fill="#ffffff" />
    <path d="M 24 28 L 27 31 L 33 25" fill="none" stroke="#101217" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="800">04. EVALUATE</text>
    <text x="20" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">50 / 50 POINTS</text>
    <text x="20" y="82" fill="#9da4b5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">verify_exam.ps1</text>
    <text x="20" y="97" fill="#7a8296" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">All 29 rubric checks</text>
  </g>
</svg>
