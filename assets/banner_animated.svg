<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Monochrome Dark Background -->
    <linearGradient id="monoBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14161b" />
      <stop offset="100%" stop-color="#0c0d10" />
    </linearGradient>

    <!-- Clay Elevation Filter -->
    <filter id="clayElevation" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#ffffff" flood-opacity="0.1" />
    </filter>

    <style>
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -32; }
      }
      @keyframes beamPulse {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.9; }
      }
      @keyframes ringPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 0.3; }
      }
      .floating-group {
        animation: floatSoft 5s ease-in-out infinite;
      }
      .stream-line {
        stroke-dasharray: 6 6;
        animation: dashAnim 2s linear infinite;
      }
      .glow-beam {
        animation: beamPulse 3s ease-in-out infinite;
      }
      .pulse-ring {
        animation: ringPulse 2.5s ease-in-out infinite;
        transform-origin: 730px 58px;
      }
    </style>
  </defs>

  <!-- Outer Glass Frame -->
  <rect x="10" y="10" width="880" height="220" rx="16" fill="url(#monoBg)" stroke="#272b36" stroke-width="1.2" />

  <!-- Technical Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="10" y1="70" x2="890" y2="70" />
    <line x1="10" y1="130" x2="890" y2="130" />
    <line x1="260" y1="10" x2="260" y2="230" />
    <line x1="620" y1="10" x2="620" y2="230" />
  </g>

  <!-- Top Glass Sheen Edge -->
  <line class="glow-beam" x1="100" y1="10" x2="800" y2="10" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />

  <!-- Floating Hero Architecture Group -->
  <g class="floating-group">
    <!-- Server Stack Clay Icon Tile -->
    <rect x="36" y="42" width="76" height="76" rx="16" fill="#1b1e26" stroke="#373c4a" stroke-width="1.2" filter="url(#clayElevation)" />
    
    <!-- Vector Server Layers Icon (Strict Monochrome) -->
    <!-- Layer 1 -->
    <rect x="49" y="55" width="50" height="12" rx="3" fill="#111318" stroke="#ffffff" stroke-width="1" stroke-opacity="0.9" />
    <circle cx="56" cy="61" r="2" fill="#ffffff" />
    <circle cx="63" cy="61" r="2" fill="#666b7a" />
    <line x1="72" y1="61" x2="91" y2="61" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round" />

    <!-- Layer 2 -->
    <rect x="49" y="74" width="50" height="12" rx="3" fill="#111318" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="56" cy="80" r="2" fill="#ffffff" stroke-opacity="0.8" />
    <circle cx="63" cy="80" r="2" fill="#666b7a" />
    <line x1="72" y1="80" x2="87" y2="80" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round" />

    <!-- Layer 3 -->
    <rect x="49" y="93" width="50" height="12" rx="3" fill="#111318" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="56" cy="99" r="2" fill="#ffffff" stroke-opacity="0.5" />
    <circle cx="63" cy="99" r="2" fill="#666b7a" />
    <line x1="72" y1="99" x2="83" y2="99" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round" />

    <!-- Typography (Clean Monochrome) -->
    <text x="130" y="72" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="1">
      SAMadali <tspan fill="#8a90a0" font-size="20" font-weight="500">IT 311</tspan>
    </text>
    <text x="130" y="98" fill="#9da4b5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" letter-spacing="0.3">
      System Administration Final Lab  •  Automated Provisioning &amp; Rubric Engine
    </text>

    <!-- Animated Data Pipeline Stream -->
    <line class="stream-line" x1="130" y1="116" x2="520" y2="116" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.35" />
  </g>

  <!-- Live Rubric Status Badge (Monochrome Wireframe & Pulsing Reticle) -->
  <g>
    <rect x="690" y="42" width="174" height="34" rx="8" fill="#13151c" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3" />
    <circle class="pulse-ring" cx="709" cy="59" r="6" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="709" cy="59" r="3" fill="#ffffff" />
    <text x="724" y="63" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="700" letter-spacing="0.8">
      RUBRIC: 50 / 50 PTS
    </text>
  </g>

  <!-- Bottom Monochrome Functional Tiles with Real Vector Icons (No Emojis) -->
  <g transform="translate(36, 150)">
    <!-- Tile 1: Auto-Pilot -->
    <rect x="0" y="0" width="190" height="48" rx="8" fill="#151820" stroke="#2c303c" stroke-width="1" />
    <!-- Lightning Bolt Vector Icon -->
    <path d="M 24 16 L 16 26 L 22 26 L 20 34 L 28 24 L 22 24 Z" fill="#ffffff" stroke="#ffffff" stroke-width="0.5" stroke-linejoin="round" />
    <text x="36" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">HOST AUTO-PILOT</text>
    <text x="36" y="38" fill="#787e91" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">1-Click VM &amp; ISO build</text>

    <!-- Tile 2: ReaLTaiizor Dark Interface -->
    <rect x="206" y="0" width="190" height="48" rx="8" fill="#151820" stroke="#2c303c" stroke-width="1" />
    <!-- Layout / Window Vector Icon -->
    <rect x="220" y="17" width="14" height="14" rx="2" fill="none" stroke="#ffffff" stroke-width="1.2" />
    <line x1="220" y1="22" x2="234" y2="22" stroke="#ffffff" stroke-width="1" />
    <line x1="225" y1="22" x2="225" y2="31" stroke="#ffffff" stroke-width="1" />
    <text x="242" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">REALTAIIZOR UI</text>
    <text x="242" y="38" fill="#787e91" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">Crown &amp; Poison controls</text>

    <!-- Tile 3: TDD Verified Suite -->
    <rect x="412" y="0" width="190" height="48" rx="8" fill="#151820" stroke="#2c303c" stroke-width="1" />
    <!-- Checkmark Shield Vector Icon -->
    <path d="M 427 16 L 434 19 L 434 26 C 434 30 427 33 427 33 C 427 33 420 30 420 26 L 420 19 Z" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M 424 24 L 426 26 L 430 22" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="442" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">TDD VERIFIED</text>
    <text x="442" y="38" fill="#787e91" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">Full Pester test suite</text>

    <!-- Tile 4: Zero External Dependency -->
    <rect x="618" y="0" width="210" height="48" rx="8" fill="#151820" stroke="#2c303c" stroke-width="1" />
    <!-- Lock Vector Icon -->
    <rect x="632" y="22" width="12" height="10" rx="1.5" fill="#ffffff" />
    <path d="M 634 22 L 634 19 C 634 17 636 15 638 15 C 640 15 642 17 642 19 L 642 22" fill="none" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="638" cy="26" r="1" fill="#151820" />
    <text x="652" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">OFFLINE RUNTIME</text>
    <text x="652" y="38" fill="#787e91" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">Zero network requirements</text>
  </g>
</svg>
