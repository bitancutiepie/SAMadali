<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#11141b" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>

    <!-- Glass Glow Gradient -->
    <linearGradient id="glassGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Clay Pill Gradient -->
    <linearGradient id="clayPill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e3d" />
      <stop offset="100%" stop-color="#151822" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffaa" />
      <stop offset="100%" stop-color="#00a8ff" />
    </linearGradient>

    <!-- Clay Shadow Filter -->
    <filter id="clayShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.08" />
    </filter>

    <!-- Subtle Particle Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.2; transform: scaleX(0.95); }
        50% { opacity: 0.8; transform: scaleX(1.05); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes badgePulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #00ffaa); }
        50% { transform: scale(1.04); filter: drop-shadow(0 0 8px #00ffaa); }
      }
      .floating-card {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .beam-line {
        animation: pulseBeam 4s ease-in-out infinite;
        transform-origin: center;
      }
      .running-dash {
        stroke-dasharray: 6 6;
        animation: dashMove 2s linear infinite;
      }
      .live-badge {
        animation: badgePulse 3s ease-in-out infinite;
        transform-origin: 750px 50px;
      }
    </style>
  </defs>

  <!-- Outer Card with Glassmorphic Border -->
  <rect x="10" y="10" width="880" height="220" rx="20" fill="url(#bgGrad)" stroke="#2b3140" stroke-width="1.5" />
  
  <!-- Subtle Grid Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
    <line x1="10" y1="65" x2="890" y2="65" />
    <line x1="10" y1="120" x2="890" y2="120" />
    <line x1="10" y1="175" x2="890" y2="175" />
    <line x1="230" y1="10" x2="230" y2="230" />
    <line x1="450" y1="10" x2="450" y2="230" />
    <line x1="670" y1="10" x2="670" y2="230" />
  </g>

  <!-- Animated Top Glass Beam -->
  <rect class="beam-line" x="150" y="10" width="600" height="2" fill="url(#glassGlow)" />

  <!-- Main Floating Glass/Clay Card Group -->
  <g class="floating-card">
    <!-- Center Hero Badge / Logo -->
    <rect x="35" y="45" width="80" height="80" rx="18" fill="url(#clayPill)" stroke="#434c62" stroke-width="1.5" filter="url(#clayShadow)" />
    
    <!-- Server / Terminal Graphic -->
    <rect x="47" y="60" width="56" height="14" rx="4" fill="#1b1f2b" stroke="#00ffaa" stroke-width="1" />
    <circle cx="56" cy="67" r="2.5" fill="#00ffaa" />
    <line x1="64" y1="67" x2="93" y2="67" stroke="#4a5568" stroke-width="2" stroke-linecap="round" />

    <rect x="47" y="80" width="56" height="14" rx="4" fill="#1b1f2b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="56" cy="87" r="2.5" fill="#38bdf8" />
    <line x1="64" y1="87" x2="85" y2="87" stroke="#4a5568" stroke-width="2" stroke-linecap="round" />

    <rect x="47" y="100" width="56" height="14" rx="4" fill="#1b1f2b" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="56" cy="107" r="2.5" fill="#e2e8f0" />
    <line x1="64" y1="107" x2="90" y2="107" stroke="#4a5568" stroke-width="2" stroke-linecap="round" />

    <!-- Typography: Title & Subtitle -->
    <text x="135" y="75" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5">
      SAMadali <tspan fill="#38bdf8" font-size="22" font-weight="600">IT 311</tspan>
    </text>
    
    <text x="135" y="102" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="0.3">
      Auto-Pilot Exam Toolkit  •  Glassmorphism + Claymorphism Architecture
    </text>

    <!-- Animated Data Path Pipeline -->
    <path class="running-dash" d="M 135 125 L 530 125" fill="none" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2" />
  </g>

  <!-- Live 50-Point Status Capsule (Top Right) -->
  <g class="live-badge">
    <rect x="670" y="38" width="195" height="36" rx="18" fill="#121820" stroke="#00ffaa" stroke-width="1.2" />
    <circle cx="692" cy="56" r="4.5" fill="#00ffaa" />
    <text x="706" y="61" fill="#00ffaa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="700" letter-spacing="0.8">
      RUBRIC SCORE: 50/50
    </text>
  </g>

  <!-- Bottom Pills (Key Features) -->
  <g transform="translate(35, 155)">
    <!-- Pill 1: 1-Click Auto-Pilot -->
    <rect x="0" y="0" width="195" height="42" rx="12" fill="#161b26" stroke="#2e384d" stroke-width="1.2" />
    <text x="16" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">⚡ 1-CLICK AUTO-PILOT</text>

    <!-- Pill 2: ReaLTaiizor Dark Glass -->
    <rect x="210" y="0" width="190" height="42" rx="12" fill="#161b26" stroke="#2e384d" stroke-width="1.2" />
    <text x="226" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🎨 REALTAIIZOR GLASS</text>

    <!-- Pill 3: TDD Verified -->
    <rect x="415" y="0" width="180" height="42" rx="12" fill="#161b26" stroke="#2e384d" stroke-width="1.2" />
    <text x="431" y="26" fill="#00ffaa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🧪 100% TDD TESTED</text>

    <!-- Pill 4: Zero Internet / Offline -->
    <rect x="610" y="0" width="220" height="42" rx="12" fill="#161b26" stroke="#2e384d" stroke-width="1.2" />
    <text x="626" y="26" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🔒 ZERO INTERNET NEEDED</text>
  </g>
</svg>
