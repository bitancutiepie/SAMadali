<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" height="220" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes softFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes cableFlow {
        to { stroke-dashoffset: -16; }
      }
      .retro-float { animation: softFloat 5s ease-in-out infinite; }
      .cursor-blink { animation: blinkCursor 1s infinite; }
      .cable-stream {
        stroke-dasharray: 4 4;
        animation: cableFlow 1.2s linear infinite;
      }
      .pixel-font {
        font-family: 'Courier New', Courier, 'Lucida Console', Monaco, monospace;
      }
    </style>
  </defs>

  <!-- Outer Dark Shell -->
  <rect x="0" y="0" width="860" height="220" fill="#0c0d10" stroke="#2b2e38" stroke-width="2" />
  
  <!-- CRT Scanlines (Subtle Monochrome) -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <line x1="0" y1="20" x2="860" y2="20" />
    <line x1="0" y1="45" x2="860" y2="45" />
    <line x1="0" y1="70" x2="860" y2="70" />
    <line x1="0" y1="95" x2="860" y2="95" />
    <line x1="0" y1="120" x2="860" y2="120" />
    <line x1="0" y1="145" x2="860" y2="145" />
    <line x1="0" y1="170" x2="860" y2="170" />
    <line x1="0" y1="195" x2="860" y2="195" />
  </g>

  <!-- Top Retro Terminal Bar -->
  <rect x="2" y="2" width="856" height="26" fill="#141720" stroke="#2b2e38" stroke-width="1" />
  <rect x="14" y="9" width="8" height="8" fill="#ffffff" stroke-opacity="0.8" />
  <rect x="26" y="9" width="8" height="8" fill="#525866" />
  <rect x="38" y="9" width="8" height="8" fill="#303542" />
  <text class="pixel-font" x="56" y="19" fill="#9da4b5" font-size="10" font-weight="700">TERMINAL://SAM_LAB/IT311_EXAM_TOOLKIT</text>

  <!-- Main Floating Hero Section -->
  <g class="retro-float">
    <!-- Pixel Server Icon Container -->
    <rect x="30" y="46" width="68" height="74" fill="#161922" stroke="#3d4354" stroke-width="2" />
    <rect x="32" y="48" width="64" height="16" fill="#1f2430" />
    <rect x="38" y="54" width="4" height="4" fill="#ffffff" />
    <rect x="46" y="54" width="44" height="4" fill="#383e4d" />
    
    <rect x="32" y="67" width="64" height="16" fill="#1f2430" />
    <rect x="38" y="73" width="4" height="4" fill="#ffffff" />
    <rect x="46" y="73" width="44" height="4" fill="#383e4d" />

    <rect x="32" y="86" width="64" height="16" fill="#1f2430" />
    <rect x="38" y="92" width="4" height="4" fill="#ffffff" />
    <rect x="46" y="92" width="44" height="4" fill="#383e4d" />

    <rect x="32" y="105" width="64" height="13" fill="#141720" />
    <text class="pixel-font" x="38" y="115" fill="#525866" font-size="8">[VBOX-7]</text>

    <!-- Header Typography -->
    <text class="pixel-font" x="115" y="72" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="1">
      SAMadali <tspan fill="#8a90a0" font-size="18" font-weight="600">[IT 311]</tspan>
    </text>
    <text class="pixel-font" x="115" y="96" fill="#9da4b5" font-size="11.5" font-weight="500">
      > 1-Click Host Auto-Pilot &amp; In-VM Rubric Evaluator
    </text>
    <text class="pixel-font" x="115" y="114" fill="#64748b" font-size="10.5">
      > Mode: Pure Soft Monochrome Retro  •  Status: READY
    </text>
    <rect class="cursor-blink" x="480" y="104" width="6" height="11" fill="#ffffff" />
  </g>

  <!-- Retro Rubric Status Badge (Top Right) -->
  <g>
    <rect x="668" y="46" width="162" height="34" fill="#161922" stroke="#ffffff" stroke-width="1.5" />
    <rect x="674" y="58" width="6" height="6" fill="#ffffff" />
    <text class="pixel-font" x="688" y="68" fill="#ffffff" font-size="11" font-weight="bold">SCORE: 50/50 PTS</text>
  </g>

  <!-- 4 Retro Function Badges (Bottom Row) -->
  <g transform="translate(30, 145)">
    <!-- Badge 1: 1-Click Auto-Pilot -->
    <rect x="0" y="0" width="185" height="52" fill="#141720" stroke="#333745" stroke-width="1.5" />
    <rect x="12" y="12" width="6" height="6" fill="#ffffff" />
    <text class="pixel-font" x="26" y="24" fill="#ffffff" font-size="10" font-weight="bold">HOST AUTO-PILOT</text>
    <text class="pixel-font" x="12" y="40" fill="#787e91" font-size="8.5">> 1-click VM deploy</text>

    <!-- Badge 2: ReaLTaiizor Dark Interface -->
    <rect x="205" y="0" width="185" height="52" fill="#141720" stroke="#333745" stroke-width="1.5" />
    <rect x="217" y="12" width="6" height="6" fill="#ffffff" />
    <text class="pixel-font" x="231" y="24" fill="#ffffff" font-size="10" font-weight="bold">REALTAIIZOR UI</text>
    <text class="pixel-font" x="217" y="40" fill="#787e91" font-size="8.5">> CrownForm layout</text>

    <!-- Badge 3: TDD Verified Suite -->
    <rect x="410" y="0" width="185" height="52" fill="#141720" stroke="#333745" stroke-width="1.5" />
    <rect x="422" y="12" width="6" height="6" fill="#ffffff" />
    <text class="pixel-font" x="436" y="24" fill="#ffffff" font-size="10" font-weight="bold">TDD VERIFIED</text>
    <text class="pixel-font" x="422" y="40" fill="#787e91" font-size="8.5">> 7/7 Pester tests</text>

    <!-- Badge 4: Offline Runtime -->
    <rect x="615" y="0" width="185" height="52" fill="#141720" stroke="#333745" stroke-width="1.5" />
    <rect x="627" y="12" width="6" height="6" fill="#ffffff" />
    <text class="pixel-font" x="641" y="24" fill="#ffffff" font-size="10" font-weight="bold">ZERO INTERNET</text>
    <text class="pixel-font" x="627" y="40" fill="#787e91" font-size="8.5">> 100% offline exam</text>
  </g>
</svg>
