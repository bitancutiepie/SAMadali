<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" height="220" shape-rendering="crispEdges">
  <defs>
    <!-- Dark System UI Gradient -->
    <linearGradient id="sysBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#040507" />
    </linearGradient>

    <!-- Subtle Violet Atmospheric Glow -->
    <filter id="soloGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#7c3aed" flood-opacity="0.35" />
    </filter>

    <style>
      @keyframes runePulse {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.85; }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes streamStep {
        to { stroke-dashoffset: -16; }
      }
      .rune-glow { animation: runePulse 4s ease-in-out infinite; }
      .cursor { animation: cursorBlink 1s infinite; }
      .data-stream {
        stroke-dasharray: 4 4;
        animation: streamStep 1.2s linear infinite;
      }
      .sys-font {
        font-family: 'Courier New', Courier, 'Lucida Console', Monaco, monospace;
      }
    </style>
  </defs>

  <!-- Outer Deep System Window Shell -->
  <rect x="1" y="1" width="858" height="218" fill="url(#sysBg)" stroke="#1e1e2d" stroke-width="2" />
  
  <!-- Stepped Pixel Corners (Solo Leveling System Window Style) -->
  <g fill="#7c3aed">
    <!-- Top-Left -->
    <rect x="3" y="3" width="6" height="2" />
    <rect x="3" y="3" width="2" height="6" />
    <rect x="7" y="7" width="2" height="2" />
    <!-- Top-Right -->
    <rect x="851" y="3" width="6" height="2" />
    <rect x="855" y="3" width="2" height="6" />
    <rect x="851" y="7" width="2" height="2" />
    <!-- Bottom-Left -->
    <rect x="3" y="215" width="6" height="2" />
    <rect x="3" y="211" width="2" height="6" />
    <rect x="7" y="211" width="2" height="2" />
    <!-- Bottom-Right -->
    <rect x="851" y="215" width="6" height="2" />
    <rect x="855" y="211" width="2" height="6" />
    <rect x="851" y="211" width="2" height="2" />
  </g>

  <!-- Subtle CRT Scanlines -->
  <g stroke="#ffffff" stroke-opacity="0.015" stroke-width="1">
    <line x1="2" y1="28" x2="858" y2="28" />
    <line x1="2" y1="56" x2="858" y2="56" />
    <line x1="2" y1="84" x2="858" y2="84" />
    <line x1="2" y1="112" x2="858" y2="112" />
    <line x1="2" y1="140" x2="858" y2="140" />
    <line x1="2" y1="168" x2="858" y2="168" />
    <line x1="2" y1="196" x2="858" y2="196" />
  </g>

  <!-- Top System Header Bar -->
  <rect x="2" y="2" width="856" height="25" fill="#0d0e17" stroke="#252438" stroke-width="1" />
  
  <!-- System Window Diamonds -->
  <polygon points="16,14 20,10 24,14 20,18" fill="#7c3aed" />
  <polygon points="28,14 31,11 34,14 31,17" fill="#4c1d95" />
  
  <text class="sys-font" x="44" y="18" fill="#a78bfa" font-size="9.5" font-weight="700" letter-spacing="1.5">SYSTEM // NOTIFICATION: QUEST READY</text>
  <text class="sys-font" x="720" y="18" fill="#6d6a8a" font-size="8.5">RANK [S] TOOLKIT</text>

  <!-- Center Hero Area -->
  <g transform="translate(32, 45)">
    <!-- Solo Leveling Monolith Rune Core Icon -->
    <rect x="0" y="0" width="70" height="74" fill="#0e0f18" stroke="#312e4d" stroke-width="2" />
    <!-- Stepped Inner Frame -->
    <rect x="4" y="4" width="62" height="66" fill="#090a12" stroke="#1d1c30" stroke-width="1" />
    
    <!-- Monolith Core Crystals & Layers -->
    <polygon points="35,12 47,28 35,44 23,28" fill="#141324" stroke="#a78bfa" stroke-width="1.5" />
    <polygon points="35,18 42,28 35,38 28,28" fill="#2e1065" stroke="#c084fc" stroke-width="1" />
    <rect x="34" y="27" width="2" height="2" fill="#ffffff" />
    
    <!-- Core Horizontal Circuit Tiers -->
    <line x1="14" y1="52" x2="56" y2="52" stroke="#4c1d95" stroke-width="1.5" />
    <line x1="18" y1="58" x2="52" y2="58" stroke="#7c3aed" stroke-width="1" />
    <rect x="22" y="62" width="26" height="4" fill="#1e1b4b" />
    <text class="sys-font" x="25" y="65" fill="#a78bfa" font-size="6" font-weight="bold">CORE_01</text>

    <!-- Title & System Description -->
    <text class="sys-font" x="90" y="24" fill="#f8fafc" font-size="22" font-weight="900" letter-spacing="1.5">
      SAMadali <tspan fill="#a78bfa" font-size="16" font-weight="700">[IT 311]</tspan>
    </text>
    
    <text class="sys-font" x="90" y="46" fill="#c4b5fd" font-size="11" font-weight="600" letter-spacing="0.5">
      > SYSTEM AUTO-PILOT : FINAL LAB PROVISIONING ENGINE
    </text>
    
    <text class="sys-font" x="90" y="64" fill="#71717a" font-size="9.5">
      > Class Sections: 3106 / 3107 / 3108  •  Environment: Isolated Guest
    </text>
    
    <rect class="cursor" x="510" y="55" width="6" height="10" fill="#a78bfa" />
  </g>

  <!-- Quest Reward Pill (Top Right) -->
  <g transform="translate(670, 45)">
    <rect x="0" y="0" width="158" height="34" fill="#0e0f18" stroke="#7c3aed" stroke-width="1.5" />
    <rect x="4" y="4" width="4" height="4" fill="#c084fc" />
    <text class="sys-font" x="16" y="16" fill="#a78bfa" font-size="8" font-weight="700">MAX EVALUATION</text>
    <text class="sys-font" x="16" y="28" fill="#ffffff" font-size="11" font-weight="900" letter-spacing="1">50 / 50 PTS</text>
    <polygon points="144,17 150,11 150,23" fill="#7c3aed" />
  </g>

  <!-- Connecting System Bus Line -->
  <line class="data-stream" x1="32" y1="135" x2="828" y2="135" stroke="#3b3759" stroke-width="1.5" />

  <!-- 4 Stepped System Modules (Bottom Row) -->
  <g transform="translate(32, 146)">
    <!-- Tile 1: Auto-Pilot -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="188" height="50" fill="#0d0e17" stroke="#252438" stroke-width="1.5" />
      <polygon points="0,0 8,0 0,8" fill="#7c3aed" />
      <text class="sys-font" x="12" y="18" fill="#f8fafc" font-size="9.5" font-weight="bold">QUEST://AUTO-PILOT</text>
      <text class="sys-font" x="12" y="32" fill="#a1a1aa" font-size="8.5">1-Click Host Execution</text>
      <text class="sys-font" x="12" y="42" fill="#585676" font-size="7.5">[VBox Provisioning]</text>
      <rect x="174" y="38" width="4" height="4" fill="#7c3aed" />
    </g>

    <!-- Tile 2: ReaLTaiizor Dark Interface -->
    <g transform="translate(204, 0)">
      <rect x="0" y="0" width="188" height="50" fill="#0d0e17" stroke="#252438" stroke-width="1.5" />
      <polygon points="0,0 8,0 0,8" fill="#7c3aed" />
      <text class="sys-font" x="12" y="18" fill="#f8fafc" font-size="9.5" font-weight="bold">INTERFACE://REALTAIIZOR</text>
      <text class="sys-font" x="12" y="32" fill="#a1a1aa" font-size="8.5">Crown &amp; Poison Form</text>
      <text class="sys-font" x="12" y="42" fill="#585676" font-size="7.5">[Zero UI Overlap]</text>
      <rect x="174" y="38" width="4" height="4" fill="#7c3aed" />
    </g>

    <!-- Tile 3: TDD Verified Suite -->
    <g transform="translate(408, 0)">
      <rect x="0" y="0" width="188" height="50" fill="#0d0e17" stroke="#252438" stroke-width="1.5" />
      <polygon points="0,0 8,0 0,8" fill="#7c3aed" />
      <text class="sys-font" x="12" y="18" fill="#f8fafc" font-size="9.5" font-weight="bold">DUNGEON://TDD_TESTS</text>
      <text class="sys-font" x="12" y="32" fill="#a1a1aa" font-size="8.5">7/7 Pester Assertions</text>
      <text class="sys-font" x="12" y="42" fill="#585676" font-size="7.5">[100% Passed Clean]</text>
      <rect x="174" y="38" width="4" height="4" fill="#7c3aed" />
    </g>

    <!-- Tile 4: Zero External Dependency -->
    <g transform="translate(612, 0)">
      <rect x="0" y="0" width="184" height="50" fill="#0d0e17" stroke="#252438" stroke-width="1.5" />
      <polygon points="0,0 8,0 0,8" fill="#7c3aed" />
      <text class="sys-font" x="12" y="18" fill="#f8fafc" font-size="9.5" font-weight="bold">SECURITY://OFFLINE</text>
      <text class="sys-font" x="12" y="32" fill="#a1a1aa" font-size="8.5">Air-Gapped Operation</text>
      <text class="sys-font" x="12" y="42" fill="#585676" font-size="7.5">[Zero Web Leaks]</text>
      <rect x="170" y="38" width="4" height="4" fill="#7c3aed" />
    </g>
  </g>
</svg>
